<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACE CALENDAR — SUMMERTECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root{--accent:#00e68a;--grape-leaf:#3b3a2e;--bg:#0a0a0a;--bg-card:#141414;--bg-card-hover:#1a1a1a;--text-primary:#f5f5f5;--text-secondary:#999;--text-muted:#666;--border:#222;--border-light:#2a2a2a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text-primary);font-family:'Pretendard','Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
  .site-header{position:sticky;top:0;z-index:100;background:#000;border-bottom:1px solid var(--border);padding:16px 0;text-align:center}
  .site-header h1{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:4px;color:#fff}
  .hero{max-width:960px;margin:0 auto;padding:64px 24px 40px;border-bottom:1px solid var(--border)}
  .hero-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  .hero h2{font-family:'Pretendard',sans-serif;font-size:28px;font-weight:700;color:var(--text-primary);line-height:1.4;margin-bottom:12px}
  .hero-meta{font-size:13px;color:var(--text-secondary);display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .hero-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-muted);display:inline-block}
  .hero-meta strong{color:var(--accent);font-weight:600}
  .verified{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--accent);opacity:0.7}
  .filter-bar{max-width:960px;margin:0 auto;padding:24px 24px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{font-family:'Pretendard',sans-serif;font-size:13px;font-weight:500;padding:8px 18px;border-radius:20px;border:1px solid var(--border-light);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.2s}
  .filter-btn:hover{border-color:var(--text-secondary);color:var(--text-primary)}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
  .content-area{max-width:960px;margin:0 auto;padding:0 24px 80px}
  .month-group{margin-top:40px}
  .month-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .month-header h3{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1px;color:var(--text-primary)}
  .month-count{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--accent);background:rgba(0,230,138,0.1);padding:3px 10px;border-radius:10px}
  .race-list{display:flex;flex-direction:column;gap:8px}
  .race-card{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:start;padding:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;transition:all 0.2s;text-decoration:none;color:inherit}
  .race-card:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
  .race-date{text-align:center}
  .race-date .day{font-family:'Inter',sans-serif;font-size:24px;font-weight:600;color:var(--text-primary);line-height:1}
  .race-date .weekday{font-size:12px;color:var(--text-muted);margin-top:4px}
  .race-info{min-width:0}
  .race-name{font-family:'Pretendard',sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:6px;line-height:1.4}
  .race-details{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .race-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px}
  .race-tag.course{color:var(--accent);background:rgba(0,230,138,0.08)}
  .race-location{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
  .race-location::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--grape-leaf);flex-shrink:0}
  .race-org{font-size:12px;color:#555;margin-top:4px}
  .race-action{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
  .badge-open{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.5px;padding:4px 12px;border-radius:4px;background:var(--grape-leaf);color:var(--accent);white-space:nowrap}
  .race-deadline{font-size:11px;color:var(--text-muted);white-space:nowrap}
  .race-deadline.urgent{color:#e85d5d}
  .btn-apply{font-family:'Pretendard',sans-serif;font-size:12px;font-weight:600;padding:6px 16px;border-radius:4px;border:1px solid var(--border-light);background:transparent;color:var(--text-secondary);text-decoration:none;transition:all 0.2s;white-space:nowrap}
  .btn-apply:hover{border-color:var(--accent);color:var(--accent)}
  .weather-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary);background:rgba(255,255,255,0.05);padding:3px 8px;border-radius:4px;margin-top:8px}
  .weather-badge .weather-icon{font-size:14px}
  .weather-badge .weather-temp{font-family:'Inter',sans-serif;font-weight:500}
  .page-footer{max-width:960px;margin:0 auto;padding:32px 24px;border-top:1px solid var(--border);text-align:center}
  .page-footer p{font-size:12px;color:var(--text-muted);line-height:1.8}
  @media(max-width:640px){
    .hero{padding:40px 20px 28px}.hero h2{font-size:22px}
    .race-card{grid-template-columns:70px 1fr;gap:16px}
    .race-action{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
    .filter-bar{padding:20px 20px 0}.content-area{padding:0 20px 60px}
    .race-location{margin-top:6px}
    .race-org{margin-top:3px}
    .weather-badge{margin-top:8px;font-size:10px;padding:2px 6px}
  }
</style>
</head>
<body>
<header class="site-header"><h1>SUMMERTECT</h1></header>
<section class="hero">
  <div class="hero-label">Race Calendar</div>
  <h2>접수 가능한 마라톤 · 트레일러닝 대회</h2>
  <div class="hero-meta" id="hero-meta"></div>
</section>
<div class="filter-bar" id="filter-bar"></div>
<div class="filter-bar" id="region-bar" style="padding-top:8px"></div>
<main class="content-area" id="content"></main>
<footer class="page-footer">
  <p>매일 오전 자동 업데이트<br>접수 마감일은 대회별로 상이하므로 반드시 각 대회 페이지에서 확인하세요</p>
  <p style="margin-top:12px;"><a href="https://www.summertect.com" style="color:#999;text-decoration:none;border-bottom:1px solid #222;">SUMMERTECT</a></p>
</footer>

  var MN={1:"JAN",2:"FEB",3:"MAR",4:"APR",5:"MAY",6:"JUN",7:"JUL",8:"AUG",9:"SEP",10:"OCT",11:"NOV",12:"DEC"};

  // Hero meta

  rb.innerHTML=rhtml;

  // Render function
  function render(){
    var ct=document.getElementById('content');
    var filtered=_d.r.filter(function(r){
      var mOk=(curMonth==='all'||String(r.m)===curMonth);
      var rgOk=(curRegion==='all'||r.rg===curRegion);
      return mOk&&rgOk;
    });

    // Regroup by month
    var fmg={};
    filtered.forEach(function(r){if(!fmg[r.m])fmg[r.m]=[];fmg[r.m].push(r)});

            +'<div class="race-action"><span class="badge-open">OPEN</span>'+dlh
            +'<span class="btn-apply">바로가기 →</span></div></a>';
        });
        chtml+='</div></div>';
      });
    }

  function fetchWeather(){
    var now=new Date();
    var cards=document.querySelectorAll('.race-card[data-lat]');
    var seen={};
    cards.forEach(function(card){
      var dt=card.dataset.date,lat=card.dataset.lat,lon=card.dataset.lon;
      if(!dt||!lat||!lon)return;
      var rd=new Date(dt+'T00:00:00');
      var diff=Math.floor((rd-now)/(1000*60*60*24));
      if(diff<0||diff>14)return;
      var key=lat+'_'+lon+'_'+dt;
      if(seen[key])return;seen[key]=true;
      var slot=card.querySelector('.weather-slot');
      if(!slot)return;
      var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&start_date='+dt+'&end_date='+dt;

          var tmin=Math.round(d.daily.temperature_2m_min[0]);
          var icon=WMO[code]||'🌡️';
          // Update all matching slots
          document.querySelectorAll('.race-card[data-date="'+dt+'"][data-lat="'+lat+'"]').forEach(function(c){
            var s=c.querySelector('.weather-slot');
            if(s)s.innerHTML='<div class="weather-badge"><span class="weather-icon">'+icon+'</span><span class="weather-temp">'+tmin+'°/'+tmax+'°</span></div>';
          });
        }
      }).catch(function(){});
    });
  }
